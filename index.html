<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schüler Galerie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            background-color: #1a1a1a;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1525307932909-fd14b501d8d3?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .header {
            position: relative;
            max-width: 1400px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }

        .school-logo {
            position: absolute;
            top: 0;
            left: 20px;
            height: 80px;
            width: auto;
            object-fit: contain;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 2.5em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            padding-top: 10px;
        }

        @media (max-width: 768px) {
            .school-logo {
                position: static;
                display: block;
                margin: 0 auto 20px;
                height: 60px;
            }
            
            h1 {
                font-size: 1.8em;
                padding-top: 0;
            }
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .student-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .student-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }

        .image-container {
            width: 100%;
            height: 180px;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .student-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .student-card:hover .student-image {
            transform: scale(1.1);
        }

        .student-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-top: 10px;
        }

        .placeholder-text {
            color: white;
            font-size: 3em;
            font-weight: bold;
        }

        /* Modal für vergrößertes Bild */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
        }

        .modal-name {
            color: white;
            text-align: center;
            font-size: 1.5em;
            margin-top: 20px;
        }

        .close-button {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 40px;
            cursor: pointer;
            background: none;
            border: none;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 20px;
            }

        }
    </style>
</head>
<body>
    <div class="header">
        <img class="school-logo" src="https://164471.logineonrw-lms.de/pluginfile.php/1/core_admin/logocompact/300x300/1763601159/LMG.png" alt="LMG Logo">
        <h1>The Great LMG 10D Book Review Page</h1>
    </div>
    
    <div class="gallery" id="gallery"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-button" onclick="closeModal()">&times;</button>
            <img class="modal-image" id="modalImage" src="" alt="">
            <div class="modal-name" id="modalName"></div>
        </div>
    </div>

    <script>
        const students = [
            "Samuel", "Lena", "Marah", "Paulina", "BenB",
            "Hanife", "Greta", "Fabio J.", "Viktor", "Ferdinand", "Amadea",
            "Fabio E.", "Jana", "Laura", 
            "Paula", "Artur", "Sarah", "Oryna", "Varvara",
            "Johan", "Liselotte", "Leo", "BenW", "Matthis", "Zamir"
        ];

        const gallery = document.getElementById('gallery');

        students.forEach((name, index) => {
            const card = document.createElement('div');
            card.className = 'student-card';
            
            // Erstelle einen Dateinamen aus dem Namen (Umlaute und Sonderzeichen angepasst)
            const fileName = name.replace(/\s+/g, '_').replace(/\./g, '');
            
            card.innerHTML = `
                <div class="image-container">
                    <img class="student-image" 
                         src="${fileName}.png" 
                         alt="${name}"
                         onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=placeholder-text>${name.charAt(0)}</div>'">
                </div>
                <div class="student-name">${name}</div>
            `;
            
            card.onclick = () => openModal(name, fileName);
            gallery.appendChild(card);
        });

        function openModal(name, fileName) {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            const modalName = document.getElementById('modalName');
            
            modalImage.src = `${fileName}.png`;
            modalName.textContent = name;
            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
        }

        // Schließe Modal bei Klick außerhalb des Bildes
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Schließe Modal mit ESC-Taste
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
